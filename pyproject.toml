[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "clibridge"
version = "0.1.0"
description = "Use your Claude Code and Codex subscriptions from OpenAI, Anthropic, LangChain, LiteLLM and other LLM SDKs"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
openai = ["openai>=1.40", "httpx>=0.27"]
anthropic = ["anthropic>=0.40", "httpx>=0.27"]
langchain = ["langchain-openai>=0.3", "httpx>=0.27"]
litellm = ["litellm>=1.60"]
all = ["clibridge[openai,anthropic,langchain,litellm]"]
chat = [
    "clibridge[all]",
    "openai-agents>=0.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "tzdata>=2024.1; platform_system == 'Windows'",
]
dev = ["clibridge[all]", "pytest>=8", "langgraph", "openai-agents"]

[project.scripts]
clibridge = "clibridge.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/clibridge"]

# clibridge.pth runs _clibridge_autoload at Python startup, which lets plain
# openai / anthropic / litellm code use clibridge models without importing clibridge.
[tool.hatch.build.targets.wheel.force-include]
"src/clibridge.pth" = "clibridge.pth"
"src/_clibridge_autoload.py" = "_clibridge_autoload.py"

[tool.hatch.build.targets.wheel.force-include-editable]
"src/clibridge.pth" = "clibridge.pth"

[tool.pytest.ini_options]
testpaths = ["tests"]
